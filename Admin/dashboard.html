<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .logout-btn {
            margin-top: 20px;
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px 15px;
            background-color: #e62525;
            color: rgb(255, 255, 255);
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        h2 {
            color: #333;
        }
        table {
            width: 80%;
            margin: auto;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }
        th {
            background: #6D5BBA;
            color: white;
        }
        .complete-btn {
            padding: 8px 12px;
            background: #28a745;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        .complete-btn:hover {
            background: #218838;
        }
    </style>
</head>
<body>
    <button class="logout-btn" onclick="logout()">Logout</button>
    <h2>Pending Orders</h2>
    <table>
        <thead>
            <tr>
                <th>Order ID</th>
                <th>Table Number</th>
                <th>Order Details</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="ordersTable">
            <!-- Orders will be loaded here dynamically -->
        </tbody>
    </table>

    <script>
        async function fetchOrders() {
            const response = await fetch("get_orders.php");
            const orders = await response.json();
            
            let tableContent = "";
            orders.forEach(order => {
                tableContent += `
                    <tr>
                        <td>${order.id}</td>
                        <td>${order.table_number}</td>
                        <td>${order.order_details}</td>
                        <td><button class="complete-btn" onclick="markAsCompleted(${order.id})">Complete</button></td>
                    </tr>
                `;
            });

            document.getElementById("ordersTable").innerHTML = tableContent;
        }

        async function markAsCompleted(orderId) {
            await fetch("update_order.php", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ orderId })
            });

            fetchOrders(); // Refresh orders list
        }

        fetchOrders(); // Load orders on page load
        setInterval(fetchOrders, 5000); // Refresh every 5 seconds
        
        function logout() {
            localStorage.clear();
            sessionStorage.clear();
            window.location.href = "../mainpg.html";
        }
    </script>

</body>
</html>
